name: Android Build

# Rust-движок (cargo-ndk) + APK (Gradle) на Linux-раннере.
# Без секретов кейстора release-APK подписывается debug-ключом (см. app/build.gradle.kts).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: 27.0.12077973

jobs:
  build:
    name: Native libs + APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform, build-tools and NDK
        run: |
          set -eu
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native libs (arm64-v8a, armeabi-v7a)
        run: |
          set -eu
          rm -rf app/src/main/jniLibs
          cargo ndk -t arm64-v8a --platform 24 -o app/src/main/jniLibs build --release
          cargo ndk -t armeabi-v7a --platform 21 -o app/src/main/jniLibs build --release
          ls -la app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a

      - name: Build release APKs
        run: |
          set -eu
          rm -f local.properties
          java -classpath gradle/wrapper/gradle-wrapper.jar \
            org.gradle.wrapper.GradleWrapperMain assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          set -eu
          mkdir -p dist
          for f in arm32 arm64 universal; do
            src=$(ls app/build/outputs/apk/$f/release/*.apk | head -n 1)
            cp "$src" "dist/tg-ws-proxy-android-$f.apk"
          done
          ls -la dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-android-apks
          path: dist/*.apk
